<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🎁 Chọn hộp quà</title>

    <link rel="stylesheet" href="./css/style.css">
</head>


<body>

    <div class="page">

        <!-- TIÊU ĐỀ -->
        <h1>
            🎁 CHỌN MỘT HỘP QUÀ 🎁
        </h1>

        <p class="sub-title">
            Mỗi hộp đang giấu một món quà dành riêng cho bạn ✨
        </p>


        <!-- ==============================
             3 HỘP QUÀ
        =============================== -->

        <div class="gift-container">


            <!-- HỘP QUÀ 1 -->

            <div class="gift-box"
                 id="gift1"
                 onclick="openGift(1)">

                <!-- CẢ 3 ĐỀU DÙNG ẢNH HỘP QUÀ ĐÓNG -->

                <img
                    src="./images/gift-box.png"
                    alt="Hộp quà 1">

                <p>
                    Hộp quà 1
                </p>

            </div>



            <!-- HỘP QUÀ 2 -->

            <div class="gift-box"
                 id="gift2"
                 onclick="openGift(2)">

                <img
                    src="./images/gift-box.png"
                    alt="Hộp quà 2">

                <p>
                    Hộp quà 2
                </p>

            </div>



            <!-- HỘP QUÀ 3 -->

            <div class="gift-box"
                 id="gift3"
                 onclick="openGift(3)">

                <img
                    src="./images/gift-box.png"
                    alt="Hộp quà 3">

                <p>
                    Hộp quà 3
                </p>

            </div>

        </div>



        <!-- ==============================
             KẾT QUẢ SAU KHI MỞ HỘP
        =============================== -->

        <div
            id="giftResult"
            class="gift-result">


            <!-- ẢNH MÓN QUÀ -->

            <img
                id="giftImage"
                src=""
                alt="Món quà">


            <!-- TÊN -->

            <h2 id="giftName"></h2>


            <!-- MÔ TẢ -->

            <p id="giftDescription"></p>


            <!-- NÚT CHỌN MẪU -->

            <button onclick="goColor()">
                🎨 CHỌN MẪU
            </button>

        </div>

    </div>



    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script>


        // Chưa chọn hộp nào

        let selectedGift = null;



        // =========================================
        // HÀM MỞ HỘP
        // =========================================

        function openGift(number) {


            // Nếu đã chọn một hộp rồi
            // thì không cho chọn hộp khác

            if (selectedGift !== null) {

                return;

            }



            // Lưu hộp được chọn

            selectedGift = number;



            // Khóa cả 3 hộp

            const allGifts =
                document.querySelectorAll(".gift-box");


            allGifts.forEach(function(box) {

                box.style.pointerEvents = "none";

            });



            // Lấy đúng hộp được chọn

            const selectedBox =
                document.getElementById(
                    "gift" + number
                );



            // Thêm hiệu ứng mở

            selectedBox.classList.add("opened");



            // =====================================
            // XÁC ĐỊNH MÓN QUÀ
            // =====================================

            let image = "";

            let name = "";

            let description = "";



            if (number === 1) {


                image =
                    "./images/gift1.png";


                name =
                    "🎀 Món quà số 1";


                description =
                    "Một món quà đặc biệt đang chờ bạn khám phá 💕";

            }



            else if (number === 2) {


                image =
                    "./images/gift2.png";


                name =
                    "🎁 Món quà số 2";


                description =
                    "Một món quà đáng yêu dành riêng cho bạn ✨";

            }



            else if (number === 3) {


                image =
                    "./images/gift3.png";


                name =
                    "💐 Món quà số 3";


                description =
                    "Một món quà thật đặc biệt cho ngày sinh nhật 💗";

            }



            // =====================================
            // SAU 600ms MỚI HIỆN MÓN QUÀ
            // =====================================

            setTimeout(function() {


                // Thay ảnh hộp quà
                // bằng ảnh món quà

                selectedBox.innerHTML = `

                    <img
                        src="${image}"
                        alt="${name}">

                    <p>
                        ${name}
                    </p>

                `;



                // Hiện ảnh món quà
                // ở phần kết quả

                document.getElementById(
                    "giftImage"
                ).src = image;



                // Hiện tên

                document.getElementById(
                    "giftName"
                ).innerText = name;



                // Hiện mô tả

                document.getElementById(
                    "giftDescription"
                ).innerText =
                    description;



                // Hiện khu vực kết quả

                document.getElementById(
                    "giftResult"
                ).classList.add("show");



                // Lưu lựa chọn

                localStorage.setItem(
                    "selectedGift",
                    number
                );



                // Hiệu ứng confetti

                createConfetti();



                // Cuộn xuống phần kết quả

                document.getElementById(
                    "giftResult"
                ).scrollIntoView({

                    behavior: "smooth"

                });


            }, 600);

        }



        // =========================================
        // SANG TRANG CHỌN MẪU
        // =========================================

        function goColor() {


            window.location.href =
                "color.html";

        }



        // =========================================
        // TẠO HIỆU ỨNG CONFETTI
        // =========================================

        function createConfetti() {


            for (let i = 0; i < 35; i++) {


                const confetti =
                    document.createElement("div");


                confetti.className =
                    "confetti";


                confetti.innerHTML =
                    ["✨", "💕", "🎉", "🌸", "💗"][
                        Math.floor(
                            Math.random() * 5
                        )
                    ];



                // Vị trí ngẫu nhiên

                confetti.style.left =
                    Math.random() * 100 + "%";



                // Độ trễ ngẫu nhiên

                confetti.style.animationDelay =
                    Math.random() * 1.5 + "s";



                // Kích thước ngẫu nhiên

                confetti.style.fontSize =
                    (15 +
                    Math.random() * 20) + "px";



                document.body.appendChild(
                    confetti
                );



                // Xóa sau khi chạy xong

                setTimeout(function() {

                    confetti.remove();

                }, 3500);

            }

        }


    </script>

</body>

</html>
