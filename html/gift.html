<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎁 Hộp quà bất ngờ</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="page">

        <h1>🎁 CHỌN MỘT HỘP QUÀ 🎁</h1>

        <p class="sub-title">
            Mỗi hộp đang giấu một món quà dành riêng cho bạn ✨
        </p>

        <div class="gift-container">

            <!-- HỘP 1 -->
            <div class="gift-box" onclick="openGift(1)" id="gift1">

                <img src="../images/gift-box.png" alt="Hộp quà 1">

                <p>Hộp quà 1</p>

            </div>


            <!-- HỘP 2 -->
            <div class="gift-box" onclick="openGift(2)" id="gift2">

                <img src="../images/gift-box.png" alt="Hộp quà 2">

                <p>Hộp quà 2</p>

            </div>


            <!-- HỘP 3 -->
            <div class="gift-box" onclick="openGift(3)" id="gift3">

                <img src="../images/gift-box.png" alt="Hộp quà 3">

                <p>Hộp quà 3</p>

            </div>

        </div>


        <!-- KẾT QUẢ SAU KHI MỞ -->
        <div id="giftResult" class="gift-result">

            <img id="giftImage" src="" alt="Món quà">

            <h2 id="giftName"></h2>

            <p id="giftDescription"></p>

            <button onclick="goColor()">
                🎨 CHỌN MẪU
            </button>

        </div>

    </div>


    <script>

        let selectedGift = null;


        function openGift(number) {

            // Nếu đã chọn rồi thì không cho chọn tiếp
            if (selectedGift !== null) {
                return;
            }

            selectedGift = number;

            // Không cho bấm các hộp còn lại
            document.querySelectorAll(".gift-box").forEach(box => {
                box.style.pointerEvents = "none";
            });


            const selectedBox =
                document.getElementById("gift" + number);


            // Hiệu ứng mở
            selectedBox.classList.add("opened");


            // Sau 600ms hiện món quà
            setTimeout(function () {

                let image = "";
                let name = "";
                let description = "";


                if (number === 1) {

                    image = "../images/gift1.png";

                    name = "🎒 Món quà số 1";

                    description =
                        "Một món quà cực kỳ dễ thương dành cho bạn 💕";

                }


                else if (number === 2) {

                    image = "../images/gift2.png";

                    name = "🧸 Món quà số 2";

                    description =
                        "Một món quà đáng yêu đang chờ bạn khám phá ✨";

                }


                else if (number === 3) {

                    image = "../images/gift3.png";

                    name = "🌷 Món quà số 3";

                    description =
                        "Một món quà đặc biệt chỉ dành cho bạn 💗";

                }


                // Thay ảnh hộp bằng ảnh món quà
                selectedBox.innerHTML =
                    `<img src="${image}" alt="${name}">`;


                // Hiện thông tin
                document.getElementById("giftImage").src = image;

                document.getElementById("giftName").innerText =
                    name;

                document.getElementById("giftDescription").innerText =
                    description;


                document.getElementById("giftResult")
                    .classList.add("show");


                // Lưu hộp đã chọn
                localStorage.setItem(
                    "selectedGift",
                    number
                );


                // Hiệu ứng
                createConfetti();

            }, 600);
        }


        function goColor() {

            window.location.href = "color.html";

        }


        function createConfetti() {

            for (let i = 0; i < 30; i++) {

                const confetti =
                    document.createElement("div");

                confetti.className = "confetti";

                confetti.innerHTML = "✨";

                confetti.style.left =
                    Math.random() * 100 + "%";

                confetti.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(confetti);


                setTimeout(() => {
                    confetti.remove();
                }, 3000);

            }

        }

    </script>

</body>

</html>
