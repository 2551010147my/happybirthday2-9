<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🎨 Chọn mẫu</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <div class="page">

        <!-- TIÊU ĐỀ -->
        <h1>🎨 CHỌN MẪU BẠN THÍCH</h1>

        <p class="sub-title">
            Chọn một mẫu duy nhất nhé 💕
        </p>


        <!-- TÊN MÓN QUÀ -->
        <h2 id="giftTitle"></h2>


        <!-- 5 MẪU -->
        <div class="color-container">

            <!-- MẪU 1 -->
            <div class="color-card"
                 onclick="chooseColor(1)"
                 id="color1">

                <img id="image1"
                     src=""
                     alt="Mẫu 1">

                <p>Mẫu 1</p>

            </div>


            <!-- MẪU 2 -->
            <div class="color-card"
                 onclick="chooseColor(2)"
                 id="color2">

                <img id="image2"
                     src=""
                     alt="Mẫu 2">

                <p>Mẫu 2</p>

            </div>


            <!-- MẪU 3 -->
            <div class="color-card"
                 onclick="chooseColor(3)"
                 id="color3">

                <img id="image3"
                     src=""
                     alt="Mẫu 3">

                <p>Mẫu 3</p>

            </div>


            <!-- MẪU 4 -->
            <div class="color-card"
                 onclick="chooseColor(4)"
                 id="color4">

                <img id="image4"
                     src=""
                     alt="Mẫu 4">

                <p>Mẫu 4</p>

            </div>


            <!-- MẪU 5 -->
            <div class="color-card"
                 onclick="chooseColor(5)"
                 id="color5">

                <img id="image5"
                     src=""
                     alt="Mẫu 5">

                <p>Mẫu 5</p>

            </div>

        </div>


        <!-- THÔNG BÁO -->
        <p id="message"></p>

    </div>


    <script>

        // ==========================================
        // LẤY HỘP QUÀ ĐÃ CHỌN
        // ==========================================

        const selectedGift =
            localStorage.getItem("selectedGift");


        // ==========================================
        // NẾU CHƯA CHỌN HỘP QUÀ
        // ==========================================

        if (!selectedGift) {

            alert("Bạn chưa chọn hộp quà!");

            window.location.href = "gift.html";

        }


        // ==========================================
        // TÊN CỦA TỪNG MÓN QUÀ
        // ==========================================

        const giftNames = {

            1: "🎒 Mẫu của món quà 1",

            2: "🧸 Mẫu của món quà 2",

            3: "🌷 Mẫu của món quà 3"

        };


        // ==========================================
        // HIỆN TÊN MÓN QUÀ
        // ==========================================

        document.getElementById("giftTitle")
            .innerText = giftNames[selectedGift];


        // ==========================================
        // HIỆN 5 ẢNH TƯƠNG ỨNG VỚI HỘP QUÀ
        // ==========================================

        for (let i = 1; i <= 5; i++) {

            document.getElementById("image" + i).src =
                `images/gift${selectedGift}-mau${i}.png`;

        }


        // ==========================================
        // BIẾN LƯU MẪU ĐÃ CHỌN
        // ==========================================

        let selectedColor = null;


        // ==========================================
        // HÀM CHỌN MẪU
        // ==========================================

        function chooseColor(number) {

            // Nếu đã chọn rồi thì không cho chọn lại
            if (selectedColor !== null) {

                return;

            }


            // Lưu mẫu được chọn
            selectedColor = number;


            // Lấy card được chọn
            const selectedCard =
                document.getElementById(
                    "color" + number
                );


            // Thêm hiệu ứng selected
            selectedCard.classList.add("selected");


            // ======================================
            // KHÓA 5 CARD
            // ======================================

            document.querySelectorAll(".color-card")
                .forEach(function(card) {

                    card.style.pointerEvents = "none";

                });


            // ======================================
            // HIỆN THÔNG BÁO
            // ======================================

            document.getElementById("message")
                .innerText =
                "✨ Đã chọn mẫu! Đang chuẩn bị bất ngờ cuối cùng... ✨";


            // ======================================
            // LƯU MẪU VÀO LOCAL STORAGE
            // ======================================

            localStorage.setItem(
                "selectedColor",
                number
            );


            // ======================================
            // TẠO HIỆU ỨNG
            // ======================================

            createConfetti();


            // ======================================
            // CHUYỂN SANG TRANG KẾT QUẢ
            // ======================================

            setTimeout(function() {

                window.location.href =
                    "result.html";

            }, 1500);

        }


        // ==========================================
        // HIỆU ỨNG PHÁO GIẤY
        // ==========================================

        function createConfetti() {

            for (let i = 0; i < 30; i++) {

                const confetti =
                    document.createElement("div");


                confetti.className =
                    "confetti";


                confetti.innerHTML = "✨";


                confetti.style.left =
                    Math.random() * 100 + "%";


                confetti.style.animationDelay =
                    Math.random() * 2 + "s";


                document.body.appendChild(confetti);


                // Xóa sau khi chạy xong
                setTimeout(function() {

                    confetti.remove();

                }, 3000);

            }

        }

    </script>

</body>

</html>
