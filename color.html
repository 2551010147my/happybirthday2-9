<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chọn mẫu 🎨</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="color-page">

        <h1>🎨 CHỌN MẪU BẠN THÍCH</h1>

        <p class="subtitle">
            Chọn một mẫu duy nhất nhé 💕
        </p>

        <!-- Hiển thị quà đã chọn -->
        <h2>
            🧸 Mẫu của món quà
            <span id="giftNumber"></span>
        </h2>

        <!-- 5 mẫu -->
        <div class="design-list" id="designList"></div>

    </div>


    <script>

        // Lấy món quà người dùng đã chọn ở gift.html
        const selectedGift = localStorage.getItem("selectedGift");


        // Nếu chưa chọn quà
        if (!selectedGift) {

            alert("Bạn chưa chọn món quà nào!");

            window.location.href = "gift.html";

        }


        // Hiển thị số món quà
        document.getElementById("giftNumber").textContent = selectedGift;


        // Lấy khu vực chứa 5 mẫu
        const designList = document.getElementById("designList");


        // Tạo 5 mẫu
        for (let i = 1; i <= 5; i++) {

            const design = document.createElement("div");

            design.className = "design-card";


            // Đường dẫn ảnh
            const imagePath =
                `images/gift${selectedGift}-mau${i}.png`;


            design.innerHTML = `

                <img
                    src="${imagePath}"
                    alt="Mẫu ${i}"
                    class="design-image"
                >

                <p>Mẫu ${i}</p>

                <button onclick="chooseDesign(${i})">
                    💖 Chọn mẫu này
                </button>

            `;


            // Thêm vào trang
            designList.appendChild(design);
        }



        // Khi chọn một mẫu
        function chooseDesign(number) {

            // Lưu mẫu đã chọn
            localStorage.setItem(
                "selectedDesign",
                `gift${selectedGift}-mau${number}.png`
            );


            // Chuyển sang trang kết quả
            window.location.href = "result.html";

        }

    </script>

</body>

</html>
