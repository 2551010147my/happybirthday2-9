<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎁 Quà của bạn</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="result-page">

        <!-- Ảnh món quà -->
        <div class="result-image-box">

            <img
                id="resultImage"
                src=""
                alt="Món quà"
                class="result-image"
            >

        </div>


        <!-- Tên món quà -->
        <h1 id="resultTitle">
            🎁 Món quà
        </h1>


        <!-- Lời chúc -->
        <p class="result-message">
            Chúc bạn có một sinh nhật thật vui vẻ,
            luôn xinh đẹp, hạnh phúc và gặp thật nhiều
            điều may mắn! 🎂 💕
        </p>


        <p class="heart">
            💗 🎀 ✨ 💗
        </p>

    </div>


    <script>

        // Lấy món quà đã chọn
        const selectedGift =
            localStorage.getItem("selectedGift");


        // Lấy mẫu đã chọn
        const selectedDesign =
            localStorage.getItem("selectedDesign");


        // Kiểm tra dữ liệu
        if (!selectedGift || !selectedDesign) {

            alert("Bạn chưa chọn quà!");

            window.location.href = "gift.html";

        }


        // Hiển thị ảnh
        document.getElementById("resultImage").src =
            "images/" + selectedDesign;


        // Hiển thị tên
        document.getElementById("resultTitle").textContent =
            "🎁 Món quà " +
            selectedGift +
            " - " +
            selectedDesign
                .replace("gift" + selectedGift + "-mau", "Mẫu ")
                .replace(".png", "");

    </script>

</body>

</html>
