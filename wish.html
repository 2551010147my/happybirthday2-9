<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lời chúc 💕</title>

    <link rel="stylesheet"
          href="./css/style.css">

</head>


<body>

    <div class="birthday-page">

        <div class="sparkle sparkle1">✨</div>
        <div class="sparkle sparkle2">💗</div>
        <div class="sparkle sparkle3">🎈</div>


        <div class="wish-card">

            <div class="wish-icon">
                💌
            </div>


            <h1>
                Một lời chúc dành cho bé Mũi💕
            </h1>


            <div class="wish-text">

                <p>
                    🎂 Chúc mừng sinh nhật !
                </p>

                <p>
                    Mong rằng tuổi mới sẽ mang đến
                    thật nhiều niềm vui, may mắn
                    và những điều thật tuyệt vời.
                </p>

                <p>
                    Mong những điều cưng mong muốn
                    đều sẽ trở thành hiện thực. 💕
                </p>

                <p>
                    Và quan trọng nhất...
                </p>

                <strong>
                    Hãy luôn vui vẻ và yêu thương
                     tui nhe hehe ! ✨
                </strong>

            </div>


            <button class="pink-button"
                    onclick="goGift()">

                🎁 Có một điều bất ngờ...

            </button>

        </div>

    </div>


    <script>

        function goGift() {

            window.location.href =
                "gift.html";

        }

    </script>

</body>

</html>
